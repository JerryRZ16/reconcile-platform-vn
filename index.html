<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      %VITE_APP_TITLE% 由 Vite 构建时按环境变量替换（HTML env replacement）：
        VITE_APP_TITLE="对账平台 · 越南"   → 越南部署
        VITE_APP_TITLE="对账平台 · 泰国"   → 泰国部署
      未设置时回退默认文案；运行时也会按当前 profile 动态更新 document.title。
    -->
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
